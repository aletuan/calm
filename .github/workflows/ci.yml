name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # tauri::generate_context! needs the frontend dist to exist at compile time.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @calm/desktop build
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The loopback capture test skips itself here (no BPF grant on runners).

  frontend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @calm/desktop coverage

  swift:
    runs-on: macos-14
    defaults:
      run:
        working-directory: native/macos-bridge
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
